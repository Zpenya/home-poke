<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>六人争上游 · 扑克</title>
<link rel="manifest" href="assets/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="六人扑克">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;outline:none}
  :root{
    --bg0:#1c3a56;--bg1:#13273d;--bg2:#0b1a2b;
    --panel:rgba(10,24,38,.55);--line:rgba(255,255,255,.14);
    --txt:#f2f6fa;--sub:#b7c9da;--dim:#7c94a8;
    --gold:#fbbf24;--green:#22c55e;--green2:#16a34a;--blue:#3b82f6;--red:#d0342c;
  }
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:radial-gradient(130% 120% at 50% 0%,var(--bg0) 0%,var(--bg1) 45%,var(--bg2) 100%);
    color:var(--txt);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;overflow:hidden;
  }
  .wrap{height:100vh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:6px;gap:8px}
  #gameView{flex-direction:column;gap:6px}

  /* ===== 通用 ===== */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
  input{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.35);color:var(--txt)}
  input:focus{border-color:var(--green)}
  button{border:none;border-radius:12px;cursor:pointer;font-weight:700;color:#fff;min-height:46px;padding:0 14px;font-size:15px;transition:filter .12s,transform .06s}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.35;cursor:not-allowed}
  .btn-g{background:linear-gradient(180deg,#34d399,#059669);box-shadow:0 3px 0 #047857}
  .btn-b{background:linear-gradient(180deg,#60a5fa,#2563eb);box-shadow:0 3px 0 #1d4ed8}
  .btn-gy{background:linear-gradient(180deg,#64748b,#475569);box-shadow:0 3px 0 #334155}
  .btn-sm{min-height:32px;padding:0 12px;font-size:13px}
  .hint{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.7}

  /* ===== 扑克牌 ===== */
  .card{position:relative;width:72px;height:100px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(150deg,#fff 0%,#f2f5f9 60%,#e6ebf1 100%);
    border:1px solid #b8c2cf;box-shadow:0 3px 7px rgba(0,0,0,.45);
    font-family:Georgia,"Times New Roman",serif;color:#1b1f24;user-select:none;touch-action:none}
  .card .corner{position:absolute;left:5px;top:3px;text-align:center;line-height:1.05;font-weight:800}
  .card .corner .crank{font-size:19px;display:block}
  .card .corner .csuit{font-size:12px;display:block;margin-top:2px}
  .card .pip{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:38px;line-height:1}
  .card.red{color:var(--red)}
  .card.joker .pip{font-size:20px;font-weight:800}
  .card.mini{width:30px;height:43px;border-radius:5px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
  .card.mini .corner{left:3px;top:2px}
  .card.mini .crank{font-size:13px}
  .card.mini .csuit{font-size:7px}
  /* 自建 CSS 牌面（无 SVG 图片，字体清晰锐利） */
  .mini-card{height:50px;min-width:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:linear-gradient(150deg,#fff 0%,#f0f3f7 70%,#e2e7ed 100%);border:1px solid #b8c2cf;border-radius:6px;
    font-weight:800;color:#1b1f24;box-shadow:0 2px 4px rgba(0,0,0,.4);padding:0 5px;pointer-events:none;font-family:Georgia,"Times New Roman",serif}
  .mini-card.red{color:var(--red)}
  .mini-card span{font-size:17px;line-height:1}
  .mini-card .ms{font-size:13px}

  /* ===== 登录 / 大厅 ===== */
  #connView{max-width:480px;margin:auto;width:100%;text-align:center;padding:26px 20px}
  #connView .logo{font-size:30px;color:var(--gold);margin-bottom:6px}
  #connView h2{font-size:22px;letter-spacing:2px;margin-bottom:4px}
  #connView .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .field{margin-bottom:10px}
  .row2{display:flex;gap:10px;margin-top:12px}
  .row2 button{flex:1}

  /* ===== 牌桌 ===== */
  .topbar{position:fixed;right:10px;bottom:10px;left:auto;top:auto;z-index:60;display:flex;gap:6px;align-items:center;
    padding:5px 8px;background:rgba(9,23,38,.92);border:1px solid #1d3a55;border-radius:22px;font-size:12px;color:var(--sub);
    box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .topbar .tag{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-weight:600}
  .topbar .btn-sm{min-height:24px;padding:0 10px;font-size:11px}
  .board{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.6fr 1fr;grid-template-rows:80px 1fr;gap:6px;padding:8px;
    background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.06),rgba(0,0,0,.16) 75%);
    border:1px solid var(--line);border-radius:18px}
  .gseat{background:transparent;border:none;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px 4px;position:relative;min-height:0;
    outline:1px solid transparent;outline-offset:1px;transition:outline-color .2s,box-shadow .2s}
  .gseat.cur{outline:2px solid var(--gold);box-shadow:0 0 14px rgba(251,191,36,.4)}
  .gseat.done{opacity:.62}
  .gseat.me{outline:2px solid rgba(34,197,94,.75)}
  .gseat .arrow{position:absolute;top:-13px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:15px;display:none;text-shadow:0 2px 5px rgba(0,0,0,.7)}
  .gseat.cur .arrow{display:block}
  .gseat .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#475569,#334155);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
  .gseat.me .avatar{background:linear-gradient(180deg,#fbbf24,#d97706);border-color:#fde68a;color:#1c1917}
  .gseat .meta{display:flex;align-items:center;gap:5px}
  .gseat .name{font-size:12px;font-weight:700;white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis}
  .gseat .cnt{font-size:11px;color:#fff;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:10px}
  .gseat .rk{font-size:11px;color:var(--gold);font-weight:800;background:rgba(251,191,36,.15);padding:1px 7px;border-radius:10px}
  .gseat .last{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center}
  .gseat .last .cards{display:flex;gap:2px;justify-content:center}
  .gseat .last .ph,.gseat .last .passTag{font-size:11px;color:var(--dim)}
  .passTag{font-size:11px;color:#e5edf5;background:rgba(59,130,246,.35);border:1px solid var(--line);border-radius:5px;padding:2px 9px}
  .oldtag{font-size:9px;color:#9fb3c5;background:rgba(0,0,0,.4);border-radius:3px;padding:0 4px;line-height:1.4}

  /* 自己的出牌：非我回合时显示在按钮上方，轮到我时不显示 */
  .mylast{display:none;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--gold);padding:0 8px;white-space:nowrap}
  .mylast .myLabel{font-weight:800}
  .mylast .myPass{font-size:11px;color:#e5edf5;background:rgba(59,130,246,.35);border:1px solid var(--line);border-radius:5px;padding:1px 8px}
  .mylast .mini-card{height:32px;min-width:20px;padding:0 3px}
  .mylast .mini-card span{font-size:12px}
  .mylast .mini-card .ms{font-size:8px}

  /* 座位环形位置：上排靠顶、左右座位内容往屏幕两侧靠 */
  .c1r1{grid-column:1;grid-row:1}.c2r1{grid-column:2;grid-row:1}.c3r1{grid-column:3;grid-row:1}
  .c1r2{grid-column:1;grid-row:2}.c3r2{grid-column:3;grid-row:2}
  .c1r1,.c2r1,.c3r1{justify-content:flex-start}
  .c1r2{align-items:flex-start}
  .c3r2{align-items:flex-end}
  .cself{display:none}

  /* 中央出牌区 */
  .center{grid-column:2;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px;min-height:0;overflow:hidden}
  #status{font-weight:800;font-size:15px;color:var(--gold);text-align:center;min-height:22px;text-shadow:0 2px 5px rgba(0,0,0,.5)}
  #passLine{font-size:12px;color:#a8c3d8;min-height:18px;text-align:center;line-height:1.4}
  #passLine b{color:#fde68a;font-weight:700}
  #tableZone{display:flex;gap:0;align-items:center;justify-content:center;min-height:88px;padding:3px}
  #tableZone .empty{color:var(--dim);font-size:13px}
  #tableZone .card{width:52px;height:72px;margin-left:-30px}
  #tableZone .card:first-child{margin-left:0}
  #tableZone .card .corner .crank{font-size:18px}
  #tableZone .card .corner .csuit{font-size:12px}
  #tableZone .card .pip{font-size:32px}

  /* ===== 手牌区 ===== */
  .handpanel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 10px 10px}
  .handbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);padding:0 4px 6px}
  .fan{display:flex;align-items:flex-end;overflow-x:auto;gap:0;padding:14px 6px 6px;min-height:104px;scrollbar-width:thin}
  .fan .card{cursor:pointer;transition:transform .13s,box-shadow .13s;position:relative;margin-left:-46px;flex-shrink:0}
  .fan .card:first-child{margin-left:0}
  .fan .card.sel{transform:translateY(-18px);box-shadow:0 10px 18px rgba(251,191,36,.5);outline:3px solid var(--gold)}
  .actions{display:flex;gap:6px;justify-content:center;margin:2px 0 0}
  .actions button{flex:0 0 auto;min-height:28px;font-size:12px;padding:0 14px;border-radius:8px}
  .actions button.hot{filter:brightness(1.14);box-shadow:0 0 0 2px var(--gold),0 2px 0 #047857;transform:scale(1.03)}
  .actions button.on{background:linear-gradient(180deg,#fbbf24,#d97706);box-shadow:0 3px 0 #b45309;color:#1c1917}

  /* ===== 记录悬浮框（记牌器+出牌记录） ===== */
  .recorder{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .rec{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:7px;text-align:center;padding:4px 1px;font-size:11px;color:var(--sub)}
  .rec b{display:block;color:var(--gold);font-size:14px;font-weight:800}
  .rec.zero{opacity:.35}
  #log2{background:rgba(0,0,0,.4);border-radius:10px;padding:9px;font-size:12px;color:#cfe0ec;height:220px;overflow-y:auto;line-height:1.75}
  #log2 .me{color:#fff;font-weight:700}#log2 .sep{color:var(--gold);font-weight:700;margin:4px 0}#log2 .act{color:#9fe3b4}

  /* ===== 弹窗 ===== */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
  .modal.show{display:flex}
  .box{background:linear-gradient(180deg,#1d3c5c,#0e2036);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;box-shadow:0 12px 45px rgba(0,0,0,.65)}
  .box h3{margin-bottom:12px;text-align:center;color:#fff}
  .pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
  .pick .card{cursor:pointer}
  .pick .card.sel{outline:3px solid var(--gold);transform:translateY(-6px)}
  .box .tip{font-size:12px;color:var(--sub);text-align:center;margin-bottom:8px}
  .btn-line{display:flex;gap:8px;margin-top:14px}
  .btn-line button{flex:1;min-height:46px;font-size:16px}

  /* ===== 战绩/排行/历史 ===== */
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
  .tabs .tab{min-height:34px;padding:0 16px;font-size:14px;border-radius:20px;background:rgba(0,0,0,.3);color:var(--sub);border:1px solid var(--line)}
  .tabs .tab.on{background:linear-gradient(180deg,#fbbf24,#d97706);color:#1c1917;font-weight:800}
  .statcard{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
  .statcard .st{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;text-align:center;padding:10px 4px}
  .statcard .st b{display:block;font-size:22px;color:var(--gold);font-weight:800}
  .statcard .st span{font-size:11px;color:var(--sub)}
  .ring{width:84px;height:84px;margin:8px auto}
  table.lst{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
  table.lst th{color:var(--sub);padding:5px;font-weight:600;border-bottom:1px solid var(--line)}
  table.lst td{padding:6px 3px;border-bottom:1px solid rgba(255,255,255,.05)}
  table.lst tr.me td{color:var(--gold);font-weight:800}
  .top3 td{color:var(--gold);font-weight:800}
  .histrow{background:rgba(0,0,0,.26);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--sub);line-height:1.7}
  .histrow b{color:var(--txt)}
  .histrow .gm{color:var(--gold);font-weight:800}
  .empty2{color:var(--dim);text-align:center;padding:20px;font-size:13px}

  /* ===== 竖屏兼容（不做专门适配，但保证可用） ===== */
  @media (orientation:portrait){
    .board{grid-template-columns:1fr 1fr 1fr}
    .cself{grid-column:1/4}
    #tableZone .card{width:40px;height:58px;margin-left:-24px}
    .card{width:40px;height:58px}
    .gseat .last .cards .card{width:22px;height:32px}
    .fan .card{width:40px;height:58px;margin-left:-24px}
    .card .corner .crank{font-size:13px}
    .card .corner .csuit{font-size:9px}
    .card .pip{font-size:26px}
    .card.joker .pip{font-size:14px}
    .mini-card{height:26px;min-width:17px;padding:0 3px;gap:0}
    .mini-card span{font-size:11px}
    .mini-card .ms{font-size:8px}
  }

  /* ===== 手机横屏紧凑（主场景） ===== */
  @media (orientation:landscape) and (max-height:520px){
    .wrap{padding:3px;gap:4px}
    #gameView{gap:4px}
    .topbar .tag{font-size:11px;padding:2px 10px}
    .topbar .btn-sm{min-height:24px;padding:0 10px;font-size:11px}
    .handpanel{padding:3px 8px 6px}
    .handbar{font-size:11px;padding:0 4px 3px}
    .actions{margin:2px 0 0}
    .actions button{min-height:24px;font-size:12px;padding:0 12px;border-radius:7px}
    .fan{min-height:72px;padding:6px 4px 4px}
    .fan .card{width:50px;height:66px;border-radius:7px;margin-left:-30px}
    .fan .card.sel{transform:translateY(-12px)}
    #tableZone{min-height:60px}
    #tableZone .card{width:40px;height:56px;margin-left:-20px}
    .board{grid-template-rows:64px 1fr}
    .mylast{font-size:11px;padding:1px 6px;gap:3px}
    .mylast .mini-card{height:26px;min-width:17px;padding:0 2px}
    .mylast .mini-card span{font-size:10px}
    .mylast .mini-card .ms{font-size:7px}
    .cself{display:none}
    .center{gap:3px;padding:3px}
    #status{font-size:13px;min-height:18px}
    #passLine{font-size:11px;min-height:16px}
    .gseat{padding:2px 3px;gap:1px}
    .gseat .avatar{width:22px;height:22px;font-size:11px}
    .gseat .name{font-size:10px;max-width:52px}
    .gseat .cnt{font-size:10px;padding:0 5px}
    .gseat .last{min-height:36px;gap:1px}
    .mini-card{height:34px;min-width:23px;padding:0 4px;gap:0}
    .mini-card span{font-size:13px}
    .mini-card .ms{font-size:10px}
    .fan .card .corner .crank{font-size:15px}
    .fan .card .corner .csuit{font-size:10px}
    .fan .card .pip{font-size:27px}
    .fan .card.joker .pip{font-size:13px}
    #tableZone .card .corner .crank{font-size:14px}
    #tableZone .card .corner .csuit{font-size:10px}
    #tableZone .card .pip{font-size:24px}
    .gseat .last .ph,.gseat .last .passTag{font-size:10px}
    .passTag{padding:1px 6px}
    .oldtag{font-size:8px}
    .cself{flex-direction:row;justify-content:center;gap:8px}
    .cself .last{flex-direction:row;min-height:0}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 登录 / 大厅 ===== -->
  <div id="connView" class="panel">
    <div class="logo">♠ ♦ ♥ ♣</div>
    <h2>六人争上游</h2>
    <div class="sub">两副牌 · 6 人 · 个人战 · 进贡回贡</div>

    <!-- 未登录：登录表单 -->
    <div id="loginBox">
      <div class="field"><input id="nameInput" placeholder="昵称（账号）"></div>
      <div class="field"><input id="passInput" type="password" placeholder="密码（首次登录即注册）"></div>
      <div class="row2">
        <button class="btn-g" onclick="doLogin()">登录</button>
        <button class="btn-b" onclick="doStats()">战绩 & 排名</button>
      </div>
    </div>

    <!-- 已登录：用户状态 + 在线玩家 + 房间操作 -->
    <div id="afterBox" style="display:none">
      <div id="myCard" style="font-weight:800;color:var(--gold);margin-bottom:8px"></div>
      <div id="onlineBox" style="font-size:13px;color:var(--sub);margin-bottom:12px;text-align:left;line-height:1.7"></div>
      <div class="row2">
        <button class="btn-g" onclick="doCreate()">创建房间</button>
        <button class="btn-b" onclick="doJoin()">加入房间</button>
      </div>
      <div class="field" style="margin-top:10px"><input id="codeInput" placeholder="输入 6 位房号加入"></div>
      <div class="row2">
        <button class="btn-gy" onclick="showStatModal('stats')">战绩 & 排名</button>
        <button class="btn-gy" onclick="doLogout()">切换账号</button>
      </div>
    </div>

    <div class="hint" id="loginHint">推荐横屏游玩。创建房间会生成 6 位房号，家人点「加入房间」输入即可一起玩，战绩自动统计。快捷键：回车=出牌、空格=不要、H=提示。</div>
  </div>

  <!-- ===== 房间 ===== -->
  <div id="roomView" class="panel" style="display:none;max-width:520px;margin:auto;width:100%">
    <h2 style="text-align:center;margin-bottom:14px;letter-spacing:2px">房间 <span id="roomCode"></span></h2>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px" id="roomSeats"></div>
    <button class="btn-g" id="startBtn" style="width:100%;margin-top:14px;display:none" onclick="startGame()">开始游戏</button>
    <div class="hint" id="waitTip" style="text-align:center;color:var(--dim)">等待房主开始游戏…</div>
  </div>

  <!-- ===== 对局 ===== -->
  <div id="gameView" style="display:none;height:100%">
    <div class="topbar">
      <span class="tag">第 <span id="roundNo">1</span> 局 · 座位 <span id="mySeatTxt"></span></span>
      <span style="display:flex;gap:8px">
        <button class="btn-gy btn-sm" onclick="toggleFull()">⛶ 全屏</button>
        <button class="btn-gy btn-sm" onclick="toggleLower()">记录</button>
        <button class="btn-gy btn-sm" onclick="showStatModal('stats')">战绩 & 排名</button>
        <button class="btn-gy btn-sm" id="btnRestart" onclick="doRestart()" style="display:none">重开</button>
      </span>
    </div>

    <div class="board" id="board">
      <div class="center" id="center">
        <div id="passLine"></div>
        <div id="status">—</div>
        <div id="tableZone"></div>
        <div id="myLastRow" class="mylast"></div>
        <div class="actions">
          <button class="btn-g" id="btnPlay" onclick="doPlay()">出牌</button>
          <button class="btn-gy" id="btnPass" onclick="doPass()">不要</button>
          <button class="btn-b" id="btnHint" onclick="doHint()">提示</button>
          <button class="btn-gy" id="btnEntrust" onclick="toggleEntrust()">托管</button>
        </div>
      </div>
    </div>

    <div class="handpanel">
      <div class="handbar"><span>我的手牌（<span id="handCount">0</span> 张）</span><span id="selCount">已选 0 张</span></div>
      <div class="fan" id="handArea"></div>
    </div>
  </div>
</div>

<!-- 记录悬浮框（记牌器 + 出牌记录） -->
<div class="modal" id="lowerModal">
  <div class="box" style="max-width:620px">
    <h3>记牌器 · 出牌记录</h3>
    <div class="tip">记牌器 · 剩余张数</div>
    <div class="recorder" id="recorder2"></div>
    <div class="tip" style="margin-top:12px">出牌记录</div>
    <div id="log2"></div>
    <div class="btn-line"><button class="btn-gy" onclick="toggleLower()">关闭</button></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="modalTitle"></h3>
    <div class="tip" id="modalTip"></div>
    <div class="pick" id="modalPick"></div>
    <div id="modalBody" style="display:none"></div>
    <div class="btn-line">
      <button class="btn-g" id="modalOk" onclick="modalOk()">确认</button>
      <button class="btn-gy" id="modalCancel" onclick="modalCancel()" style="display:none">取消</button>
    </div>
  </div>
</div>

<script>
"use strict";
let ws=null,connected=false,mySeat=-1,hostSeat=-1,roomCode="",roomToken=localStorage.getItem("poker_room_token")||"",loginToken=localStorage.getItem("poker_token")||"";
let hand=[],selected=new Set(),currentTurn=-1,free=false,tableCards=[],tableSeat=-1;
let gameState="idle",roundNo=0,hintIdx=0,autoMode=false,trickSeq=0;
let passSeats=new Set();
let myLastAction=null,myFreeTurn=false;
let entrusted=false;
let players=Array.from({length:6},(_,i)=>({seat:i,name:"",isBot:false,online:false,cardCount:0,rank:0,last:[],trickSeq:0}));
let modalMode="";
const RANK_TOTAL={3:8,4:8,5:8,6:8,7:8,8:8,9:8,10:8,11:8,12:8,13:8,14:8,15:8,16:2,17:2};
const playedCount={};Object.keys(RANK_TOTAL).forEach(r=>playedCount[r]=0);
let loggedIn=false,userName=localStorage.getItem("poker_name")||"",myStats=null,rankList=null,historyList=null;

const $=id=>document.getElementById(id);
const RL=r=>r<=10?String(r):({11:"J",12:"Q",13:"K",14:"A",15:"2",16:"小王",17:"大王"}[r]);
const SS=s=>["♠","♥","♣","♦"][s]||"";
const RD=c=>c.suit===1||c.rank===17;
function cardText(c){return c?((c.suit===4?RL(c.rank):RL(c.rank)+SS(c.suit))):"";}
function seatName(s){return players[s]?(s===mySeat?"我":(players[s].name||"空")):"空";}
function avatarChar(s){return s===mySeat?"我":(players[s].name||"空").charAt(0);}

/* ===== 音效（Web Audio 合成，无外部素材） ===== */
let AC=null;
function aCtx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC;}
function tone(freq,type,dur,vol,delay=0){const c=aCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;const t=c.currentTime+delay;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur);}
function snap(dur,vol,freq,delay=0){const c=aCtx();if(!c)return;const len=Math.floor(c.sampleRate*dur);const buf=c.createBuffer(1,len,c.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.2);const n=c.createBufferSource();n.buffer=buf;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;f.Q.value=1;const g=c.createGain();g.gain.setValueAtTime(vol,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+delay+dur);n.connect(f);f.connect(g);g.connect(c.destination);n.start(c.currentTime+delay);n.stop(c.currentTime+delay+dur);}
function playCardSound(){snap(0.09,0.5,1500);tone(230,"triangle",0.05,0.16,0.005);}
function passSound(){tone(320,"sine",0.16,0.22);}
function bombSound(){snap(0.5,0.65,280);tone(60,"sawtooth",0.35,0.5);tone(45,"square",0.4,0.32,0.02);}
function isBomb(cards){if(!cards||cards.length<2)return false;if(cards.length===2&&cards.some(c=>c.rank===16)&&cards.some(c=>c.rank===17))return true;if(cards.length===4&&cards.every(c=>c.rank===cards[0].rank))return true;return false;}

function cardFile(c){
  if(c.rank===17)return "assets/cards/red_joker.svg";
  if(c.rank===16)return "assets/cards/black_joker.svg";
  const R={3:'3',4:'4',5:'5',6:'6',7:'7',8:'8',9:'9',10:'T',11:'J',12:'Q',13:'K',14:'A',15:'2'};
  const S=['s','h','c','d'];
  return "assets/cards/"+R[c.rank]+S[c.suit]+".svg";
}
function cardEl(c){
  const d=document.createElement("div");d.className="card"+(RD(c)?" red":"");
  d.dataset.id=c.id;
  const r=RL(c.rank),jk=c.rank>=16;
  const sym=jk?"★":SS(c.suit);
  d.innerHTML=`<div class="corner"><span class="crank">${jk?"王":r}</span><span class="csuit">${sym}</span></div><div class="pip">${jk?(c.rank===17?"大王":"小王"):sym}</div>`;
  return d;
}
function miniCardHTML(c){
  const r=RL(c.rank),jk=c.rank>=16;
  const sym=jk?"★":SS(c.suit);
  return `<div class="mini-card${RD(c)?" red":""}"><span>${jk?"王":r}</span><span class="ms">${sym}</span></div>`;
}
function appendLog(t,cls){const l=$("log2"),line=document.createElement("div");line.innerHTML=t;if(cls)line.className=cls;l.appendChild(line);l.scrollTop=l.scrollHeight;}
function setStatus(t){const s=$("status");if(s)s.textContent=t;}
function setHint(t){const h=$("loginHint");if(h)h.textContent=t;}

function seatGridCell(s){const off=(s-mySeat+6)%6;if(off===0)return"cself";if(off===1)return"c3r2";if(off===2)return"c3r1";if(off===3)return"c2r1";if(off===4)return"c1r1";return"c1r2";}
function renderSeats(){
  const board=$("board"),center=$("center");
  // 增量更新：座位 DOM 按 seat 复用，避免每次动作全量重建（减少闪烁与图片重载）
  for(let s=0;s<6;s++){
    const p=players[s];
    let d=board.querySelector('.gseat[data-seat="'+s+'"]');
    const cls="gseat "+seatGridCell(s)+(s===mySeat?" me":"")+(currentTurn===s&&gameState!=="round_over"?" cur":"")+(p.rank>0?" done":"");
    if(!d){d=document.createElement("div");d.dataset.seat=s;board.appendChild(d);}
    d.className=cls;
    const nm=s===mySeat?"我":(p.name||"空");
    const cnt=p.rank>0?`<span class="rk">第${p.rank}名</span>`:(p.name?`<span class="cnt">${p.cardCount}</span>`:"<span class='cnt'>空</span>");
    const arrow=currentTurn===s?"▼":"";
    const isThisTrick=p.trickSeq===trickSeq&&trickSeq>0;
    const didPass=p.name&&passSeats.has(s);
    let body="";
    if(p.name){
      if(didPass){body=`<div class="last"><span class="passTag">不出</span></div>`;}
      else if(p.last&&p.last.length){
        const cards=p.last.map(miniCardHTML).join("");
        body=isThisTrick?`<div class="last"><div class="cards">${cards}</div></div>`
          :`<div class="last"><div class="cards" style="opacity:.42">${cards}</div><span class="oldtag">上轮</span></div>`;
      }else{body=`<div class="last"><span class="ph">—</span></div>`;}
    }else{body=`<div class="last"><span class="ph">等待加入</span></div>`;}
    d.innerHTML=`<div class="arrow">${arrow}</div><div class="meta"><span class="name">${nm}</span>${cnt}</div>${body}`;
  }
  // 清理可能遗留的多余座位节点（保留 center）
  [...board.children].forEach(ch=>{if(ch!==center&&!ch.dataset.seat)ch.remove();});
}
function renderRoomSeats(){
  const wrap=$("roomSeats");wrap.innerHTML="";
  players.forEach(p=>{
    const d=document.createElement("div");d.className="gseat"+(p.seat===mySeat?" me":"");
    d.style.minHeight="60px";d.style.gridColumn="auto";d.style.gridRow="auto";
    const nm=p.seat===mySeat?"我":(p.name||"空");
    const st=p.name?(p.isBot?"机器人":"在线"):"等待加入";
    d.innerHTML=`<div class="meta"><span class="name">${nm}</span><span class="cnt">${st}</span></div>`;
    wrap.appendChild(d);
  });
  $("startBtn").style.display=mySeat===hostSeat?"block":"none";
  $("waitTip").style.display=mySeat===hostSeat?"none":"block";
}
function renderHand(){
  const wrap=$("handArea");wrap.innerHTML="";
  const sorted=[...hand].sort((a,b)=>b.rank-a.rank||b.suit-a.suit||b.deck-a.deck);
  sorted.forEach(c=>{const el=cardEl(c);el.addEventListener("click",()=>onCardClick(c.id));if(selected.has(c.id))el.classList.add("sel");wrap.appendChild(el);});
  $("handCount").textContent=hand.length;
  $("selCount").textContent="已选 "+selected.size+" 张";
}
function renderPassLine(){
  const el=$("passLine");if(!el)return;
  if(!passSeats.size){el.innerHTML="";return;}
  el.innerHTML=[...passSeats].map(s=>`<b>${seatName(s)}</b> 不出`).join("　");
}
function renderTable(){
  const wrap=$("tableZone");wrap.innerHTML="";
  if(!tableCards.length){wrap.innerHTML="<span class='empty'>— 出牌区 —</span>";return;}
  tableCards.forEach(c=>wrap.appendChild(cardEl(c)));
}
function renderRecorder(){
  const r=$("recorder2");r.innerHTML="";
  Object.keys(RANK_TOTAL).forEach(k=>{
    const left=RANK_TOTAL[k]-playedCount[k];
    const d=document.createElement("div");d.className="rec"+(left===0?" zero":"");
    d.innerHTML=`<b>${left}</b>${RL(+k)}`;r.appendChild(d);
  });
}
function showView(v){
  $("connView").style.display=v==="conn"?"block":"none";
  $("roomView").style.display=v==="room"?"block":"none";
  $("gameView").style.display=v==="game"?"flex":"none";
}
function renderMyLast(){
  const el=$("myLastRow");if(!el)return;
  const p=players[mySeat];
  if(!p||!p.name){el.style.display="none";el.innerHTML="";return;}
  if(currentTurn===mySeat){el.style.display="none";el.innerHTML="";return;} // 轮到自己时不回显
  if(myFreeTurn){el.style.display="none";el.innerHTML="";return;}
  if(myLastAction==="pass"||passSeats.has(mySeat)){el.style.display="flex";el.innerHTML=`<span class="myLabel">我出</span><span class="myPass">不出</span>`;return;}
  if(!p.last||!p.last.length){el.style.display="none";el.innerHTML="";return;}
  el.style.display="flex";
  el.innerHTML=`<span class="myLabel">我出</span>${p.last.map(miniCardHTML).join("")}`;
}
function syncUI(){
  const playing=gameState==="playing";
  $("btnPlay").disabled=!playing;$("btnPass").disabled=!playing;$("btnHint").disabled=!playing;
  $("btnPlay").classList.toggle("hot",currentTurn===mySeat);
  try{renderSeats();}catch(e){console.error("renderSeats:",e);}
  renderMyLast();
  const rb=$("btnRestart");if(rb)rb.style.display=(mySeat===hostSeat&&gameState!=="idle")?"inline-block":"none";
}
function toggleSel(id){
  if(gameState!=="playing")return;
  if(selected.has(id))selected.delete(id);else selected.add(id);
  const el=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if(el)el.classList.toggle("sel");
  $("selCount").textContent="已选 "+selected.size+" 张";
}

/* ===== 拖动选牌：手指/鼠标在手牌上划过批量选中 ===== */
let dragDown=null,dragActive=false,skipClick=false;
function onCardClick(id){
  if(skipClick){skipClick=false;return;}
  toggleSel(id);
}
function initDragSelect(){
  const area=$("handArea");
  if(!area)return;
  function cardAt(x,y){
    const el=document.elementFromPoint(x,y);
    return el&&el.closest?el.closest(".card"):null;
  }
  area.addEventListener("pointerdown",e=>{
    if(gameState!=="playing")return;
    const card=e.target.closest(".card");
    if(!card)return;
    e.preventDefault();
    dragDown={x:e.clientX,y:e.clientY,start:card};
    dragActive=false;
  });
  window.addEventListener("pointermove",e=>{
    if(!dragDown)return;
    if(!dragActive&&Math.hypot(e.clientX-dragDown.x,e.clientY-dragDown.y)>7)dragActive=true;
    if(!dragActive)return;
    const cur=cardAt(e.clientX,e.clientY);
    if(!cur)return;
    const cards=[...area.querySelectorAll(".card")];
    const i0=cards.indexOf(dragDown.start),i1=cards.indexOf(cur);
    if(i0<0||i1<0)return;
    const lo=Math.min(i0,i1),hi=Math.max(i0,i1);
    for(let i=lo;i<=hi;i++){
      const id=cards[i].dataset.id;
      if(selected.has(id)){selected.delete(id);cards[i].classList.remove("sel");}
      else{selected.add(id);cards[i].classList.add("sel");}
    }
    $("selCount").textContent="已选 "+selected.size+" 张";
  });
  window.addEventListener("pointerup",()=>{
    if(dragActive)skipClick=true;
    dragDown=null;dragActive=false;
  });
  window.addEventListener("pointercancel",()=>{dragDown=null;dragActive=false;});
}
initDragSelect();

function autoAct(){
  if(currentTurn!==mySeat||gameState!=="playing")return;
  if(autoMode)return; // 防止重复触发
  autoMode=true;send({type:"hint"});
}

function getServer(){
  const v=($("ipInput")&&$("ipInput").value||"").trim();
  if(v)return v;
  if(location&&location.host)return location.host;
  return "127.0.0.1:8080";
}
function connect(){return new Promise((resolve,reject)=>{
  if(ws){try{ws.close();}catch(e){}}
  const addr=getServer();let url;
  if(/^wss?:\/\//.test(addr))url=addr;
  else if(location&&location.protocol==="https:")url="wss://"+addr;
  else url="ws://"+addr;
  ws=new WebSocket(url);
  ws.onopen=()=>{connected=true;resolve();};
  ws.onerror=()=>reject(new Error("无法连接服务器 "+url));
  ws.onclose=()=>{connected=false;setStatus("连接已断开，请刷新");};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(err){return;}try{handle(m);}catch(err){console.error("handle:",err);}};
});}
function send(o){if(ws&&connected)ws.send(JSON.stringify(o));}

async function doLogin(){
  const name=$("nameInput").value.trim();
  if(!name){setHint("请输入昵称");return;}
  try{await connect();}catch(err){setHint(err.message);return;}
  send({type:"login",name,password:$("passInput").value||""});
  setHint("正在登录…");
}
function doLogout(){loggedIn=false;localStorage.removeItem("poker_token");localStorage.removeItem("poker_room_token");showLogin();setHint("已切换账号，可重新登录");}
function showAfter(){
  $("loginBox").style.display="none";
  $("afterBox").style.display="block";
  const s=myStats;const wr=s&&s.games?Math.round(s.wins/s.games*100):0;
  $("myCard").textContent="已登录："+userName+(s?(" · "+s.games+" 局 / 胜 "+s.wins+" / 胜率 "+wr+"%"):"（新账号）");
}
function showLogin(){$("loginBox").style.display="block";$("afterBox").style.display="none";}
function renderOnline(list){
  const box=$("onlineBox");
  if(!list||!list.length){box.innerHTML="在线玩家：暂无其他人在线";return;}
  box.innerHTML="在线玩家："+list.map(n=>n===userName?`<b style="color:var(--gold)">${n}（我）</b>`:n).join("、");
}

async function doCreate(){if(!loggedIn){setHint("请先登录账号");return;}try{await connect();}catch(err){setHint(err.message);return;}send({type:"create_room",name:userName});}
async function doJoin(){
  if(!loggedIn){setHint("请先登录账号");return;}
  const code=$("codeInput").value.trim();
  if(code.length!==6){alert("请输入 6 位房号");return;}
  try{await connect();}catch(err){setHint(err.message);return;}
  send({type:"join_room",roomCode:code,name:userName});
}
async function doStats(){
  try{await connect();}catch(err){setHint(err.message);return;}
  if(loggedIn)send({type:"get_stats"});
  send({type:"get_ranking"});
  send({type:"get_history"});
  setHint("正在拉取战绩…");
}

/* ===== 战绩 / 排行榜 / 历史 弹窗 ===== */
let statTab="stats";
function showStatModal(tab){
  statTab=tab||statTab;
  modalMode="display";
  $("modalTitle").textContent="战绩 · 排行榜 · 历史";
  $("modalTip").textContent="";$("modalPick").innerHTML="";
  $("modalBody").style.display="block";
  $("modalOk").textContent="关闭";$("modalOk").style.display="block";$("modalCancel").style.display="none";
  const tabs=`<div class="tabs">
    <button class="tab${statTab==='stats'?' on':''}" onclick="showStatModal('stats')">我的战绩</button>
    <button class="tab${statTab==='rank'?' on':''}" onclick="showStatModal('rank')">排行榜</button>
    <button class="tab${statTab==='hist'?' on':''}" onclick="showStatModal('hist')">历史对局</button></div>`;
  let body="";
  if(statTab==="stats"){
    const g=myStats?myStats.games:0,w=myStats?myStats.wins:0,wr=g?Math.round(w/g*100):0;
    body=`<div class="statcard">
      <div class="st"><b>${g}</b><span>总局数</span></div>
      <div class="st"><b>${w}</b><span>胜场</span></div>
      <div class="st"><b>${wr}%</b><span>胜率</span></div>
      <div class="st"><b>${myRank()||"-"}</b><span>当前排名</span></div></div>
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" stroke-dasharray="${wr*2.51} 251" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">${wr}%</text></svg></div>
      ${!myStats?`<div class="empty2">登录后可查看你的战绩</div>`:""}`;
  }else if(statTab==="rank"){
    if(!rankList||!rankList.length){body=`<div class="empty2">暂无排行数据</div>`;}
    else{
      body=`<table class="lst"><tr><th>名次</th><th>昵称</th><th>局数</th><th>胜场</th><th>胜率</th></tr>`+
      rankList.slice(0,10).map((r,i)=>
        `<tr class="${r.name===userName?'me':(i<3?'top3':'')}"><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${r.name}</td><td>${r.games}</td><td>${r.wins}</td><td>${r.games?Math.round(r.wins/r.games*100):0}%</td></tr>`).join("")+"</table>";
    }
  }else{
    if(!historyList||!historyList.length){body=`<div class="empty2">暂无历史对局（打一局后自动记录）</div>`;}
    else{
      body=historyList.slice(0,20).map(h=>{
        const names=h.results||[];
        const myRk=(names.find(r=>r.name===userName)||{}).rank;
        const nameStr=names.map(r=>r.name===userName?`<b>${r.name}（第${r.rank}名）</b>`:`${r.name}（第${r.rank}名）`).join("、");
        return `<div class="histrow"><b>第 ${h.round} 局</b> · <span class="gm">${timeStr(h.time)}</span><br>${nameStr}${myRk?("<br>你的名次：第"+myRk+"名"):""}${h.tribute?("<br>进贡："+h.tribute):""}</div>`;
      }).join("");
    }
  }
  $("modalBody").innerHTML=tabs+body;
  $("modal").classList.add("show");
}
function myRank(){const i=(rankList||[]).findIndex(r=>r.name===userName);return i<0?null:i+1;}
function timeStr(ts){if(!ts)return "";const d=new Date(ts);return (d.getMonth()+1)+"月"+d.getDate()+"日 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function showRankingModal(){showStatModal("stats");}

function startGame(){send({type:"start_game"});}
function doRestart(){
  if(!confirm("重新开始本局？将按首局规则重新洗牌发牌，当前对局作废。"))return;
  send({type:"restart"});
}
function doPlay(){
  if(currentTurn!==mySeat){setStatus("还没轮到你出牌，请等待");return;}
  if(!selected.size){setStatus("请先点击要出的牌");return;}
  send({type:"play",cardIds:[...selected]});selected.clear();renderHand();
}
function doPass(){
  if(currentTurn!==mySeat){setStatus("还没轮到你");return;}
  if(free){setStatus("自由出牌时不能选“不要”");return;}
  send({type:"pass"});selected.clear();renderHand();
}
function doHint(){if(currentTurn!==mySeat){setStatus("还没轮到你");return;}hintIdx=0;send({type:"hint"});}
function toggleEntrust(){
  entrusted=!entrusted;
  const b=$("btnEntrust");
  if(b){b.textContent=entrusted?"托管中":"托管";b.classList.toggle("on",entrusted);}
  setStatus(entrusted?"已开启托管 · 轮到你会自动出牌":"已关闭托管 · 手动出牌");
  if(entrusted&&currentTurn===mySeat&&gameState==="playing")autoAct();
}
function toggleLower(){const m=$("lowerModal");if(!m)return;m.classList.toggle("show");}
function toggleFull(){
  const d=document.documentElement;
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    (d.requestFullscreen?d.requestFullscreen():d.webkitRequestFullscreen?d.webkitRequestFullscreen():Promise.resolve()).catch(()=>setHint("当前浏览器不支持全屏，建议「添加到主屏幕」后从桌面图标打开"));
  }else{
    (document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen?document.webkitExitFullscreen():null);
  }
}

function openModal(title,tip,cards,okLabel,mode){
  modalMode=mode;
  $("modalTitle").textContent=title;$("modalTip").textContent=tip;
  $("modalPick").innerHTML="";$("modalBody").style.display="none";$("modalBody").innerHTML="";
  const pick=$("modalPick");
  cards.forEach(c=>{const el=cardEl(c);el.style.cursor="pointer";
    el.addEventListener("click",()=>{[...pick.children].forEach(x=>x.classList.remove("sel"));el.classList.add("sel");pick.dataset.sel=c.id;});
    pick.appendChild(el);});
  $("modalOk").textContent=okLabel||"确认";$("modalOk").style.display="block";$("modalCancel").style.display="none";
  $("modal").classList.add("show");
}
function modalOk(){
  if(modalMode==="round"){
    if(mySeat===hostSeat){send({type:"next_round"});$("modal").classList.remove("show");}
    else{setStatus("请等待房主开始下一局");}
    return;
  }
  if(modalMode==="display"){$("modal").classList.remove("show");return;}
  if(modalMode!=="tribute"&&modalMode!=="return"){$("modal").classList.remove("show");return;}
  const pick=$("modalPick"),id=pick.dataset.sel;
  if(!id){setStatus("请先选择一张牌");return;}
  if(modalMode==="tribute")send({type:"tribute",cardId:id});
  else if(modalMode==="return")send({type:"return_tribute",cardId:id});
  $("modal").classList.remove("show");
}
function modalCancel(){$("modal").classList.remove("show");}

function handle(m){
  switch(m.type){
    case "login_ok":{
      loggedIn=true;userName=m.name;myStats=m.stats;
      localStorage.setItem("poker_name",userName);
      if(m.token){loginToken=m.token;localStorage.setItem("poker_token",loginToken);}
      showAfter();
      send({type:"get_online"});send({type:"get_ranking"});send({type:"get_history"});
      setHint("");
      break;}
    case "login_fail":{setHint("登录失败："+(m.message||"密码不正确"));break;}
    case "stats":{myStats=m.stats;break;}
    case "ranking":{rankList=m.list;break;}
    case "history":{historyList=m.list;break;}
    case "online":{renderOnline(m.list);break;}
    case "room_created":case "room_joined":{
      mySeat=m.seat;roomToken=m.token;roomCode=m.code;
      localStorage.setItem("poker_room_token",roomToken);
      $("roomCode").textContent=roomCode;$("mySeatTxt").textContent=mySeat+1;
      showView("room");renderRoomSeats();
      break;}
    case "room_state":{
      hostSeat=m.hostSeat;const arr=m.players;
      for(let i=0;i<arr.length;i++){const p=arr[i];
        players[p.seat]={seat:p.seat,name:p.name||"",isBot:p.isBot,online:p.online,cardCount:p.cardCount,rank:p.rank||0,last:players[p.seat]?players[p.seat].last:[],trickSeq:players[p.seat]?players[p.seat].trickSeq:0};}
      gameState=m.state;roundNo=m.round||roundNo;
      renderRoomSeats();syncUI();
      break;}
    case "deal":{
      roundNo=m.round;gameState="playing";
      hand=m.hand;selected.clear();hintIdx=0;
      players.forEach(p=>{p.cardCount=18;p.rank=0;p.last=[];p.trickSeq=0;});
      trickSeq=0;Object.keys(playedCount).forEach(k=>playedCount[k]=0);
      myLastAction=null;myFreeTurn=false;
      $("roundNo").textContent=roundNo;
      showView("game");
      appendLog("<span class='sep'>———— 第 "+roundNo+" 局开始 ————</span>","sep");
      renderHand();renderRecorder();syncUI();
      break;}
    case "game_start":{roundNo=m.round;$("roundNo").textContent=roundNo;showView("game");break;}
    case "turn":{
      currentTurn=m.seat;free=m.free;syncUI();
      if(free){trickSeq++;tableCards=[];tableSeat=-1;passSeats.clear();myFreeTurn=(m.seat===mySeat);try{renderTable();}catch(e){}renderPassLine();}
      if(currentTurn===mySeat){
        if(entrusted){setStatus("托管中 · 自动出牌…");autoAct();}
        else setStatus(free?"轮到你了 · 自由出牌":"轮到你了 · 请出牌或不要");
      }
      else setStatus("等待 "+seatName(currentTurn)+" 出牌…");
      break;}
    case "played":{
      const s=m.seat;tableCards=m.cards;tableSeat=s;
      players[s].last=m.cards.slice();players[s].trickSeq=trickSeq;passSeats.clear();
      m.cards.forEach(c=>playedCount[c.rank]++);
      if(s===mySeat){const ids=new Set(m.cards.map(c=>c.id));hand=hand.filter(c=>!ids.has(c.id));selected.clear();renderHand();myLastAction="play";myFreeTurn=false;}
      players[s].cardCount=Math.max(0,players[s].cardCount-m.cards.length);
      renderTable();renderPassLine();renderRecorder();syncUI();
      try{if(isBomb(m.cards))bombSound();else playCardSound();}catch(e){}
      appendLog((s===mySeat?"<span class='me'>我</span>":"<b>"+seatName(s)+"</b>")+" 出牌（"+m.cards.length+" 张）","act");
      break;}
    case "passed":{passSeats.add(m.seat);if(m.seat===mySeat)myLastAction="pass";renderPassLine();syncUI();try{passSound();}catch(e){}appendLog(seatName(m.seat)+" 不出");break;}
    case "player_finished":{players[m.seat].rank=m.rank;players[m.seat].cardCount=0;syncUI();appendLog(seatName(m.seat)+" 获得第"+m.rank+"名");break;}
    case "hand_update":{hand=m.hand;selected.clear();renderHand();players[mySeat].cardCount=hand.length;syncUI();break;}
    case "tribute_announce":{appendLog("进入进贡环节");break;}
    case "tribute_required":{
      const choices=hand.filter(c=>c.rank===m.maxRank);
      openModal("进贡 · 送手中最大的牌","你上一局是末游，进贡给 "+seatName(m.toSeat),choices,"确认进贡","tribute");
      break;}
    case "tribute_paid":{appendLog(seatName(m.fromSeat)+" 进贡"+(m.toSeat===mySeat?"给你 ":" ")+cardText(m.card));break;}
    case "return_tribute_required":{
      const choices=hand.filter(c=>c.id!==m.forbiddenId);
      openModal("回贡 · 选一张给 "+seatName(m.fromSeat),"不能回刚收到的那张牌",choices,"确认回贡","return");
      break;}
    case "return_tribute_paid":{appendLog(seatName(m.fromSeat)+" 回贡"+(m.toSeat===mySeat?"给你 ":" ")+cardText(m.card));break;}
    case "tribute_done":{setStatus("进贡完成");break;}
    case "resistance":{appendLog(seatName(m.seat)+" 手握两张大王，抗贡！");break;}
    case "round_over":{
      gameState="round_over";
      const fr=m.finishRanks||{};
      for(let s=0;s<6;s++){players[s].rank=fr[s]||0;players[s].cardCount=0;}
      syncUI();
      modalMode="round";
      $("modalTitle").textContent="本局结束";$("modalTip").textContent="";
      $("modalPick").innerHTML="";$("modalBody").style.display="block";
      const rk=$("modalBody");rk.innerHTML="<div style='text-align:center;line-height:2'>";
      (m.ranking||[]).forEach((seat,idx)=>{rk.innerHTML+=`第${idx+1}名：<b>${seatName(seat)}</b><br>`;});
      if(m.resistanceNext)rk.innerHTML+="<br><span style='color:var(--gold)'>末游手握两张大王，下局抗贡</span>";
      rk.innerHTML+="</div>";
      const isHost=mySeat===hostSeat;
      $("modalOk").className="btn-g";$("modalOk").style.width="100%";
      $("modalOk").textContent=isHost?"▶ 开始下一局":"等待房主开始下一局…";
      $("modalOk").style.display="block";$("modalCancel").style.display="none";
      $("modal").classList.add("show");
      break;}
    case "hint_result":{
      const arr=m.candidates;
      if(autoMode){autoMode=false;
        if(arr.length){selected.clear();arr[0].forEach(id=>selected.add(id));renderHand();doPlay();}
        else doPass();
        return;}
      if(!arr.length){setStatus("没有能压过的牌，可点“不要”");return;}
      selected.clear();const g=arr[hintIdx%arr.length];hintIdx++;
      g.forEach(id=>selected.add(id));renderHand();
      break;}
    case "error":{
      setStatus("提示："+m.message);appendLog("⚠ "+m.message);
      if(/重连凭证无效|座位不存在|房间不存在/.test(m.message)&&gameState==="idle"){
        localStorage.removeItem("poker_room_token");
        if(userName){loggedIn=true;showAfter();send({type:"get_online"});}
        return;
      }
      if(/还没轮到|当前不是|不能Pass|当前不能/.test(m.message)){send({type:"reconnect",token:roomToken});}
      break;}
    case "state":{restoreState(m);break;}
  }
}
function restoreState(m){
  if(m.seat!=null)mySeat=m.seat;
  gameState=m.state;roundNo=m.round||1;currentTurn=m.currentTurn;hostSeat=m.hostSeat;free=true;
  trickSeq=1;$("roundNo").textContent=roundNo;
  const arr=m.players;
  for(let i=0;i<arr.length;i++){const p=arr[i];
    players[p.seat]={seat:p.seat,name:p.name||"",isBot:p.isBot,online:p.online,cardCount:p.cardCount,rank:p.rank||0,last:[],trickSeq:0};}
  const t=m.table;
  if(t){tableCards=t.cards;tableSeat=t.seat;free=false;}else{tableCards=[];tableSeat=-1;}
  if(m.hand){hand=m.hand;selected.clear();}
  showView("game");renderHand();renderTable();renderRecorder();syncUI();
  if(m.log&&m.log.length){
    $("log2").innerHTML="";
    m.log.forEach(x=>{
      if(x.kind==="play")appendLog((x.seat===mySeat?"<span class='me'>我</span>":"<b>"+seatName(x.seat)+"</b>")+" 出牌（"+x.cards.length+" 张）","act");
      else if(x.kind==="pass")appendLog(seatName(x.seat)+" 不出");
      else if(x.kind==="round_over")appendLog("<span class='sep'>———— 第 "+roundNo+" 局结束 ————</span>","sep");
    });
  }
  if(m.table)setStatus("轮次继续 · 当前需压 "+seatName(tableSeat)+" 的牌");
  if(entrusted&&currentTurn===mySeat&&gameState==="playing"){setStatus("托管中 · 自动出牌…");autoAct();}
}
document.addEventListener("keydown",e=>{
  if($("gameView").style.display==="none")return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea")return;
  if(e.key==="Enter"){e.preventDefault();if(!$("btnPlay").disabled)doPlay();}
  else if(e.key===" "){e.preventDefault();if(!$("btnPass").disabled)doPass();}
  else if(e.key==="h"||e.key==="H"){if(!$("btnHint").disabled)doHint();}
  else if(e.key==="e"||e.key==="E"){toggleEntrust();}
  else if(e.key==="r"||e.key==="R"){toggleLower();}
});
document.addEventListener("DOMContentLoaded",()=>{
  const savedName=localStorage.getItem("poker_name");
  const rt=localStorage.getItem("poker_room_token");
  const lt=localStorage.getItem("poker_token");
  if(!savedName&&!rt&&!lt)return; // 从未登录
  connect().then(()=>{
    if(rt){send({type:"reconnect",token:rt});} // 回到房间/对局
    else if(lt){send({type:"resume_session",token:lt});} // 恢复登录态（大厅）
    else if(savedName){loggedIn=true;userName=savedName;showAfter();send({type:"get_online"});send({type:"get_ranking"});} // 离线兜底
  }).catch(()=>{
    if(savedName){loggedIn=true;userName=savedName;showAfter();} // 离线也能看已登录大厅
  });
});
</script>
